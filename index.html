<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una sorpresa para ti</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff1ec;--ink:#4a1f2e;--soft:#8a5565;--rose:#e0486b;--rose2:#f4a3b5;--card:#ffffff;--cream:#ffe7a8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1219;--ink:#ffe9ee;--soft:#d9a3b2;--card:#3c1b26;--cream:#ffe7a8}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:500;line-height:1.15;margin:0 0 .6em}
h1{font-size:clamp(2.2rem,9vw,4rem)}h2{font-size:clamp(1.6rem,6vw,2.4rem)}
section{display:none;min-height:100vh;padding:32px 20px;max-width:640px;margin:0 auto;text-align:center;flex-direction:column;justify-content:center;align-items:center}
section.on{display:flex;animation:in .6s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
p{font-size:1.1rem;line-height:1.6;color:var(--soft);max-width:34ch}
button.main{background:var(--rose);color:#fff;border:0;border-radius:999px;padding:14px 30px;font:600 1.05rem Nunito,sans-serif;cursor:pointer;margin-top:18px;transition:transform .15s}
button.main:active{transform:scale(.95)}button.main:focus-visible,.card:focus-visible,.heart:focus-visible,.flame:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
button.main[disabled]{opacity:.35;cursor:default}
.gift{font-size:6rem;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;margin-top:10px}
.card{perspective:700px;height:150px;border:0;background:none;padding:0;cursor:pointer}
.card .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;align-items:center;justify-content:center;padding:12px;font-size:1rem}
.front{background:var(--rose);color:#fff;font-size:2.2rem}
.back{background:var(--card);color:var(--ink);transform:rotateY(180deg);border:2px solid var(--rose2);line-height:1.35;font-weight:600}
.field{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin-top:6px}
.heart{border:0;background:none;font-size:3.4rem;cursor:pointer;transition:transform .15s;line-height:1;padding:6px}
.heart:hover{transform:scale(1.12)}
.heart.broke{animation:crack .5s forwards;pointer-events:none}
@keyframes crack{30%{transform:scale(1.3) rotate(-10deg)}100%{transform:scale(.9);opacity:.0}}
.heart.done{font-size:.95rem;font-weight:600;color:var(--ink);background:var(--card);border:2px solid var(--rose2);border-radius:14px;opacity:1;animation:none;font-family:Nunito,sans-serif;display:flex;align-items:center;justify-content:center;min-height:86px;padding:8px;pointer-events:none}
#counter{color:var(--soft);margin:6px 0 0;font-size:1rem}
.letter{background:var(--card);border-radius:20px;padding:26px 22px;text-align:left;width:100%;min-height:280px;box-shadow:0 10px 30px rgba(224,72,107,.15)}
.letter p{max-width:none;color:var(--ink);font-family:Fraunces,Georgia,serif;font-size:1.15rem;white-space:pre-wrap;margin:0}
.cake{width:min(300px,80vw);margin:6px 0}
.flame{cursor:pointer;transform-origin:center bottom;animation:fl .5s infinite alternate}
@keyframes fl{to{transform:scale(1.12,.92)}}
.flame.out{opacity:0;animation:none;pointer-events:none;transition:opacity .4s}
canvas#c{position:fixed;inset:0;pointer-events:none;z-index:9}
.mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:10;background:var(--card);color:var(--ink);border:2px solid var(--rose2);border-radius:999px;padding:6px 12px;font:600 .9rem Nunito,sans-serif;cursor:pointer}
.flsvg{width:min(420px,94vw);height:auto;margin-top:4px}
.stem{stroke-dasharray:100;animation:grow 1.6s var(--o) ease-out both}
@keyframes grow{from{stroke-dashoffset:100}}
.lf{animation:pop .8s calc(var(--o) + 1.8s) ease-out both}
.pt{transform-origin:150px 140px;animation:pop .8s var(--d) cubic-bezier(.3,1.4,.5,1) both}
.ctr{transform-origin:150px 140px;animation:pop .7s calc(var(--o) + 3.6s) ease-out both}
@keyframes pop{from{transform:scale(0)}}
.paper{transform-origin:210px 360px;animation:pop .8s ease-out both}
.rib{transform-origin:210px 310px;animation:pop .7s 5s cubic-bezier(.3,1.4,.5,1) both}
.bq{transform-origin:210px 330px;animation:sway 4s 7.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(0)}to{transform:rotate(1.8deg)}}
.ftxt{animation:fin 1s 7s ease both;margin:6px 0 0}
@keyframes fin{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<section id="s0" class="on">
  <div class="gift" aria-hidden="true">🎁</div>
  <h1>Tengo algo para ti</h1>
  <p>Pero primero tienes que desbloquearlo.</p>
  <button class="main" data-go="1">Abrir sorpresa</button>
</section>

<section id="s1">
  <h2>Un ramo para ti</h2>
  <svg class="flsvg" id="garden" viewBox="0 0 420 380" role="img" aria-label="Un ramo de flores que se abren"></svg>
  <p class="ftxt" id="ftxt"></p>
  <button class="main" id="b1" data-go="2" disabled>Seguir</button>
</section>

<section id="s2">
  <h2>Rompe los corazones</h2>
  <p>Cada corazón guarda algo que me gusta de ti.</p>
  <div class="field" id="field"></div>
  <p id="counter"></p>
  <button class="main" id="b2" data-go="3" disabled>Seguir</button>
</section>

<section id="s3">
  <h2>Una carta para ti</h2>
  <div class="letter"><p id="letter"></p></div>
  <button class="main" id="b3" data-go="4" disabled>Falta una última cosa</button>
</section>

<section id="s4">
  <h2 id="fin">¡Feliz cumpleaños adelantado!</h2>
  <svg class="cake" viewBox="0 0 300 260" role="img" aria-label="Pastel con velas">
    <ellipse cx="150" cy="238" rx="130" ry="14" fill="#000" opacity=".12"/>
    <rect x="40" y="150" width="220" height="82" rx="16" fill="#8b4a3a"/>
    <path d="M40 166q18 18 36 0t36 0 36 0 36 0 36 0 36 0v-4a16 16 0 0 0-16-16H56a16 16 0 0 0-16 16z" fill="#fff6f2"/>
    <rect x="70" y="100" width="160" height="56" rx="14" fill="#f4a3b5"/>
    <path d="M70 116q20 18 40 0t40 0 40 0 40 0v-2a14 14 0 0 0-14-14H84a14 14 0 0 0-14 14z" fill="#fff6f2"/>
    <circle cx="100" cy="208" r="7" fill="#e0486b"/><circle cx="150" cy="212" r="7" fill="#e0486b"/><circle cx="200" cy="208" r="7" fill="#e0486b"/>
    <g id="candles"></g>
  </svg>
  <p id="hint">Sopla o toca las llamas para apagar las velas y pide un deseo.</p>
  <button class="main" id="mic">🎤 Soplar las velas</button>
  <button class="main" id="again" hidden>Volver a empezar</button>
</section>

<script>
/* ===== EDITA AQUÍ ===== */
var NOMBRE = "Mi Stephi";
var FLORMSG = "Un ramo para alguien muy especial.";
var CORAZONES = ["Tu sonrisa","Tu esencia","Tu ternura","Tu forma de ser","Tus ojitos","Tus abracitos"];
var CARTA = "Hola, "+NOMBRE+".\n\nBuenas noches :3 Quería aprovechar este tiempito para decir lo feliz que me tienes. De verdad, estoy muy agradecido con el destino por haberte puesto en mi camino. Este es un pequeño detalle que he preparado para ti. Gracias por ser tan especial conmigo.\n\nCon muchísimo cariño.";
/* ======================= */
var $=function(s){return document.querySelector(s)};
var secs=document.querySelectorAll("section");
function go(n){secs.forEach(function(s,i){s.classList.toggle("on",i==n)});window.scrollTo(0,0);if(n==1)flower();if(n==3)typeLetter();if(n==4)burst()}
document.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(+b.dataset.go)}});

/* Ramo animado */
var fl=false;
function flower(){if(fl)return;fl=true;
var F=[[118,150,.7,1,"#ffd23f","#ffb400","#7a4a21"],[302,150,.7,1.6,"#c8a2f0","#8e5bd6","#ffe7a8"],[155,225,.5,2.2,"#ff9f80","#f06a4d","#ffe7a8"],[265,225,.5,2.8,"#f9c6d4","#e0486b","#ffb400"],[210,100,.95,0,"#f4a3b5","#e0486b","#ffb400"]];
var lv='<path class="lf" style="--o:-.8s;transform-origin:210px 285px" d="M205 290 C165 285 135 255 128 228 C165 233 195 255 205 290Z" fill="#4f9d6a"/><path class="lf" style="--o:-.8s;transform-origin:210px 285px" d="M215 290 C255 285 285 255 292 228 C255 233 225 255 215 290Z" fill="#5fb07b"/>',st="",hd="";
F.forEach(function(f){var x=f[0],y=f[1],s=f[2],o=f[3],i,p="";
st+='<path class="stem" pathLength="100" style="--o:'+o+'s" d="M210 300 C210 250 '+x+' '+((300+y)/2+20)+' '+x+' '+y+'" fill="none" stroke="#4f9d6a" stroke-width="5" stroke-linecap="round"/>';
for(i=0;i<8;i++)p+='<g transform="rotate('+i*45+' 150 140)"><ellipse class="pt" style="--d:'+(o+1.6+i*.18)+'s" cx="150" cy="96" rx="22" ry="44" fill="'+f[4]+'"/></g>';
for(i=0;i<8;i++)p+='<g transform="rotate('+(22.5+i*45)+' 150 140)"><ellipse class="pt" style="--d:'+(o+3+i*.07)+'s" cx="150" cy="112" rx="15" ry="30" fill="'+f[5]+'"/></g>';
hd+='<g transform="translate('+(x-150*s)+' '+(y-140*s)+') scale('+s+')" style="--o:'+o+'s">'+p+'<circle class="ctr" cx="150" cy="140" r="22" fill="'+f[6]+'"/></g>'});
var pa='<path class="paper" d="M138 255 Q210 275 282 255 L222 360 L198 360Z" fill="#ffe7a8"/><path class="paper" d="M210 268 L282 255 L222 360 L210 338Z" fill="#f4c27a"/>';
var rb='<g class="rib"><path d="M170 300 Q210 313 250 300 L247 316 Q210 329 173 316Z" fill="#e0486b"/><path d="M210 310 C186 286 160 306 181 321 C196 329 206 319 210 310Z" fill="#e0486b"/><path d="M210 310 C234 286 260 306 239 321 C224 329 214 319 210 310Z" fill="#e0486b"/><circle cx="210" cy="311" r="6" fill="#b5304f"/></g>';
$("#garden").innerHTML='<g class="bq">'+lv+st+pa+hd+rb+'</g>';$("#ftxt").textContent=FLORMSG;
setTimeout(function(){$("#b1").disabled=false},7800)}

/* Corazones */
var broken=0;
function upd(){$("#counter").textContent=broken+" de "+CORAZONES.length}
CORAZONES.forEach(function(t){var h=document.createElement("button");h.className="heart";h.textContent="❤️";h.setAttribute("aria-label","Corazón, toca para romperlo");
h.onclick=function(){h.classList.add("broke");setTimeout(function(){h.classList.remove("broke");h.classList.add("done");h.textContent=t;
if(++broken==CORAZONES.length){$("#b2").disabled=false;burst()}upd()},450)};$("#field").appendChild(h)});upd();

/* Carta */
var typed=false;
function typeLetter(){if(typed)return;typed=true;var i=0,el=$("#letter");
(function t(){el.textContent=CARTA.slice(0,i++);if(i<=CARTA.length)setTimeout(t,38);else{$("#b3").disabled=false;$("#b3").textContent="Ver mi regalo"}})()}

/* Velas */
var out=0,N=3,snuffs=[];
[105,150,195].forEach(function(x){
var g=document.createElementNS("http://www.w3.org/2000/svg","g");
g.innerHTML='<rect x="'+(x-5)+'" y="64" width="10" height="38" rx="3" fill="#ffe7a8"/><g class="flame" tabindex="0" role="button" aria-label="Apagar vela"><ellipse cx="'+x+'" cy="52" rx="8" ry="13" fill="#ffb400"/><ellipse cx="'+x+'" cy="55" rx="4" ry="8" fill="#fff3b0"/><circle cx="'+x+'" cy="52" r="22" fill="transparent"/></g>';
var f=g.querySelector(".flame");function snuff(){if(f.classList.contains("out"))return;f.classList.add("out");if(++out==N){$("#hint").textContent="¡Que todos tus deseos se cumplan, "+NOMBRE+"! 🎂";$("#again").hidden=false;$("#mic").hidden=true;burst();tune()}}
snuffs.push(snuff);f.onclick=snuff;f.onkeydown=function(e){if(e.key=="Enter"||e.key==" "){e.preventDefault();snuff()}};$("#candles").appendChild(g)});
$("#again").onclick=function(){location.reload()};

/* Soplar con el micrófono */
var micOn=false;
function mic(){if(micOn)return;
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$("#hint").textContent="Tu navegador no permite usar el micrófono. Toca las llamas para apagarlas.";return}
navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(st){
micOn=true;$("#mic").hidden=true;$("#hint").textContent="Ahora sopla cerca del micrófono 💨";
AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume();
var an=AC.createAnalyser();an.fftSize=1024;AC.createMediaStreamSource(st).connect(an);
var d=new Float32Array(an.fftSize),t0=Date.now(),sum=0,n=0,thr=.15,acc=0,last=Date.now();
(function tick(){if(out>=N){st.getTracks().forEach(function(t){t.stop()});return}
an.getFloatTimeDomainData(d);var r=0,i;for(i=0;i<d.length;i++)r+=d[i]*d[i];r=Math.sqrt(r/d.length);
var now=Date.now(),dt=now-last;last=now;
if(now-t0<700){sum+=r;n++;thr=Math.max(.12,(sum/n)*3.5)}
else if(r>thr){acc+=dt;if(acc>300){acc=0;var l=document.querySelector(".flame:not(.out)");if(l)l.onclick()}}
else acc=Math.max(0,acc-dt);
requestAnimationFrame(tick)})();
}).catch(function(){$("#hint").textContent="No pude usar el micrófono. Toca las llamas para apagarlas."})}
$("#mic").onclick=mic;

/* Confeti */
var cv=$("#c"),cx=cv.getContext("2d"),P=[],run=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener("resize",size);
function burst(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;var cols=["#e0486b","#f4a3b5","#ffe7a8","#ffb400","#fff"];
for(var i=0;i<130;i++)P.push({x:innerWidth/2,y:innerHeight/2.2,vx:(Math.random()-.5)*14,vy:Math.random()*-13-2,s:4+Math.random()*6,c:cols[i%5],r:Math.random()*6});
if(!run){run=true;loop()}}
function loop(){cx.clearRect(0,0,cv.width,cv.height);P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.r+=.2;cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});
P=P.filter(function(p){return p.y<cv.height+20});if(P.length)requestAnimationFrame(loop);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}}

/* Música: Cumpleaños feliz (generada, sin archivos) */
var AC=null;
function tune(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var G=392,A=440,B=494,C=523,D=587,E=659,F=698,H=784;
var n=[[G,.5],[G,.5],[A,1],[G,1],[C,1],[B,2],[G,.5],[G,.5],[A,1],[G,1],[D,1],[C,2],[G,.5],[G,.5],[H,1],[E,1],[C,1],[B,1],[A,1],[F,.5],[F,.5],[E,1],[C,1],[D,1],[C,2]];
var t=AC.currentTime+.05;n.forEach(function(x){var o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=x[0];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+x[1]*.4-.02);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+x[1]*.4);t+=x[1]*.4})}catch(e){}}
$("#mus").onclick=function(){tune()};
</script>
</body>
</html>
